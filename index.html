<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magikarp Jump Aquarium | Restorative Ecosystem</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #03080e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #e0f2fe;
    }

    canvas#aquarium {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
    }

    /* Soft Fascination HUD Overlay (Auto-hiding during inactivity) */
    #hud-overlay {
      position: absolute;
      top: 16px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
      opacity: 1;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #hud-overlay.idle-hidden {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }

    .hud-card {
      pointer-events: auto;
      background: rgba(5, 12, 20, 0.76);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(251, 191, 36, 0.22);
      border-radius: 14px;
      padding: 10px 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .title-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .title-main {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-badge {
      background: rgba(251, 191, 36, 0.16);
      border: 1px solid rgba(251, 191, 36, 0.45);
      color: #fcd34d;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .status-badge {
      font-size: 9px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status-balanced {
      background: rgba(52, 211, 153, 0.14);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .status-grazing {
      background: rgba(251, 191, 36, 0.14);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .status-sparse {
      background: rgba(248, 113, 113, 0.14);
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .title-sub {
      font-size: 10px;
      color: #94a3b8;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Biomass Meters */
    .meters-col {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .meter-box {
      display: flex;
      flex-direction: column;
      width: 72px;
      gap: 3px;
    }

    .meter-header {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .meter-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
    }

    .meter-bar-fill {
      height: 100%;
      width: 50%;
      transition: width 0.3s ease;
    }

    /* Metrics Row */
    .metrics-row {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 48px;
    }

    .metric-val {
      font-size: 13px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #5eead4;
    }

    .metric-lbl {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-top: 1px;
    }

    .metric-divider {
      width: 1px;
      height: 22px;
      background: rgba(255, 255, 255, 0.08);
    }

    /* Right-side Controls */
    .controls-card {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-soft {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
      padding: 7px 13px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.02em;
      transition: all 0.25s ease;
    }

    .btn-soft:hover {
      background: rgba(30, 41, 59, 0.85);
      border-color: rgba(94, 234, 212, 0.45);
      color: #5eead4;
      transform: translateY(-1px);
    }

    .btn-soft.active {
      background: rgba(13, 148, 136, 0.25);
      border-color: rgba(45, 212, 191, 0.6);
      color: #5eead4;
    }

    .champion-btn {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(217, 119, 6, 0.16));
      border: 1px solid rgba(251, 191, 36, 0.45);
      color: #fcd34d;
      padding: 7px 13px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.02em;
      transition: all 0.25s ease;
    }

    .champion-btn:hover {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.35), rgba(217, 119, 6, 0.28));
      border-color: rgba(251, 191, 36, 0.7);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.3);
    }

    #bottom-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: rgba(148, 163, 184, 0.42);
      letter-spacing: 0.06em;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.8s ease;
    }

    #bottom-hint.idle-hidden {
      opacity: 0;
    }
  </style>
</head>

<body>

  <canvas id="aquarium"></canvas>

  <!-- Top Soft Fascination Telemetry HUD -->
  <div id="hud-overlay">
    <div class="hud-card">
      <div class="title-group">
        <div class="title-main">
          <span>Magikarp Aquarium</span>
          <span class="title-badge">Tri-Trait Evolved</span>
        </div>
        <div class="title-sub">
          <span>Serene Homeostasis</span>
          <span class="status-badge status-balanced" id="eco-status">Balanced Waters</span>
        </div>
      </div>

      <div class="metric-divider"></div>

      <div class="meters-col">
        <div class="meter-box">
          <div class="meter-header">
            <span>🌿 Flora</span>
            <span id="metric-biomass-pct" style="color: #34d399; font-weight:600;">72%</span>
          </div>
          <div class="meter-bar-bg">
            <div class="meter-bar-fill" id="metric-biomass-bar"
              style="background: linear-gradient(90deg, #f59e0b, #10b981);"></div>
          </div>
        </div>
        <div class="meter-box">
          <div class="meter-header">
            <span>🔬 Biofilm</span>
            <span id="metric-algae-pct" style="color: #5eead4; font-weight:600;">18%</span>
          </div>
          <div class="meter-bar-bg">
            <div class="meter-bar-fill" id="metric-algae-bar"
              style="background: linear-gradient(90deg, #0d9488, #2dd4bf);"></div>
          </div>
        </div>
      </div>

      <div class="metric-divider"></div>

      <div class="metrics-row">
        <div class="metric-item">
          <span class="metric-val" id="metric-pop">3</span>
          <span class="metric-lbl">Magikarp (~5 Cap)</span>
        </div>
        <div class="metric-divider"></div>
        <div class="metric-item">
          <span class="metric-val" id="metric-gen">Gen 1</span>
          <span class="metric-lbl">Lineage</span>
        </div>
        <div class="metric-divider"></div>
        <div class="metric-item">
          <span class="metric-val" id="metric-fps" style="color: #99f6e4;">60</span>
          <span class="metric-lbl">FPS</span>
        </div>
      </div>
    </div>

    <div class="hud-card controls-card">
      <button class="btn-soft" id="btn-audio" title="Toggle gentle hydroacoustic soundscape">
        <span id="audio-icon">🔈</span>
        <span id="audio-label">Ambient Audio</span>
      </button>
      <button class="champion-btn" id="btn-spawn-champion" title="Spawn saved highest generation fish into aquarium">
        👑 Spawn Champion (<span id="spawn-btn-gen">Gen 1</span>)
      </button>
    </div>
  </div>

  <div id="bottom-hint">Tap water to ripple · Move mouse to reveal controls</div>

        let t0 = 0.6 - x0 * x0 - y0 * y0 - z0 * z0;
        if (t0 > 0) {
          const gi0 = this.permMod12[ii + this.perm[jj + this.perm[kk]]];
          t0 *= t0;
          n0 = t0 * t0 * (this.grad3[gi0][0] * x0 + this.grad3[gi0][1] * y0 + this.grad3[gi0][2] * z0);
        }
        let t1 = 0.6 - x1 * x1 - y1 * y1 - z1 * z1;
        if (t1 > 0) {
          const gi1 = this.permMod12[ii + i1 + this.perm[jj + j1 + this.perm[kk + k1]]];
          t1 *= t1;
          n1 = t1 * t1 * (this.grad3[gi1][0] * x1 + this.grad3[gi1][1] * y1 + this.grad3[gi1][2] * z1);
        }
        let t2 = 0.6 - x2 * x2 - y2 * y2 - z2 * z2;
        if (t2 > 0) {
          const gi2 = this.permMod12[ii + i2 + this.perm[jj + j2 + this.perm[kk + k2]]];
          t2 *= t2;
          n2 = t2 * t2 * (this.grad3[gi2][0] * x2 + this.grad3[gi2][1] * y2 + this.grad3[gi2][2] * z2);
        }
        let t3 = 0.6 - x3 * x3 - y3 * y3 - z3 * z3;
        if (t3 > 0) {
          const gi3 = this.permMod12[ii + 1 + this.perm[jj + 1 + this.perm[kk + 1]]];
          t3 *= t3;
          n3 = t3 * t3 * (this.grad3[gi3][0] * x3 + this.grad3[gi3][1] * y3 + this.grad3[gi3][2] * z3);
        }
        return 32.0 * (n0 + n1 + n2 + n3);
      }
    }

    const simplex = new SimplexNoise();

    // The old implementation evaluated eight 3D simplex samples for every plant
    // segment, particle, fish, and kelp strand on every frame.  A slowly refreshed
    // flow field keeps the same coherent-water feeling while making each consumer a
    // cheap bilinear lookup.
    const FLOW_CELL_SIZE = 96;
    let flowCols = 0;
    let flowRows = 0;
    let flowU = new Float32Array(0);
    let flowV = new Float32Array(0);
    let lastFlowUpdate = -Infinity;

    function rebuildFlowField(timeSec) {
      flowCols = Math.ceil(w / FLOW_CELL_SIZE) + 1;
      flowRows = Math.ceil(h / FLOW_CELL_SIZE) + 1;
      flowU = new Float32Array(flowCols * flowRows);
      flowV = new Float32Array(flowCols * flowRows);
      const t = timeSec * 0.14;

      for (let row = 0; row < flowRows; row++) {
        for (let col = 0; col < flowCols; col++) {
          const x = col * FLOW_CELL_SIZE * 0.012;
          const y = row * FLOW_CELL_SIZE * 0.012;
          const i = row * flowCols + col;
          flowU[i] = (Math.sin(x + t) + Math.cos(y * 1.3 - t * 0.8)) * 5.5;
          flowV[i] = (Math.cos(y - t * 0.9) - Math.sin(x * 1.2 + t * 0.7)) * 5.5;
        }
      }
      lastFlowUpdate = timeSec;
    }

    function getCurlNoise(x, y, timeSec) {
      if (timeSec - lastFlowUpdate > 0.5 || flowU.length === 0) rebuildFlowField(timeSec);

      const gx = clamp(x / FLOW_CELL_SIZE, 0, flowCols - 1.001);
      const gy = clamp(y / FLOW_CELL_SIZE, 0, flowRows - 1.001);
      const x0 = gx | 0;
      const y0 = gy | 0;
      const x1 = x0 + 1;
      const y1 = y0 + 1;
      const tx = gx - x0;
      const ty = gy - y0;
      const i00 = y0 * flowCols + x0;
      const i10 = y0 * flowCols + x1;
      const i01 = y1 * flowCols + x0;
      const i11 = y1 * flowCols + x1;
      const u0 = flowU[i00] + (flowU[i10] - flowU[i00]) * tx;
      const u1 = flowU[i01] + (flowU[i11] - flowU[i01]) * tx;
      const v0 = flowV[i00] + (flowV[i10] - flowV[i00]) * tx;
      const v1 = flowV[i01] + (flowV[i11] - flowV[i01]) * tx;
      return { u: u0 + (u1 - u0) * ty, v: v0 + (v1 - v0) * ty };
    }

    // =========================================================================
    // Procedural Web Audio API Hydroacoustic Synthesis
    // =========================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.ambientGain = null;
        this.filter = null;
        this.lfo = null;
        this.noiseNode = null;
        this.isEnabled = false;
        this.isInitialized = false;
      }

      init() {
        if (this.isInitialized) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          this.ctx = new AudioContext();

          this.ambientGain = this.ctx.createGain();
          this.ambientGain.gain.setValueAtTime(0.0001, this.ctx.currentTime);
          this.ambientGain.connect(this.ctx.destination);

          this.filter = this.ctx.createBiquadFilter();
          this.filter.type = 'lowpass';
          this.filter.frequency.setValueAtTime(190, this.ctx.currentTime);
          this.filter.Q.setValueAtTime(1.1, this.ctx.currentTime);
          this.filter.connect(this.ambientGain);

          const bufferSize = this.ctx.sampleRate * 5;
          const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.040;
            b6 = white * 0.115926;
          }

          this.noiseNode = this.ctx.createBufferSource();
          this.noiseNode.buffer = noiseBuffer;
          this.noiseNode.loop = true;
          this.noiseNode.connect(this.filter);
          this.noiseNode.start(0);

          this.lfo = this.ctx.createOscillator();
          this.lfo.frequency.setValueAtTime(0.07, this.ctx.currentTime);
          const lfoGain = this.ctx.createGain();
          lfoGain.gain.setValueAtTime(30, this.ctx.currentTime);
          this.lfo.connect(lfoGain);
          lfoGain.connect(this.filter.frequency);
          this.lfo.start(0);

          this.isInitialized = true;
        } catch (err) {
          console.warn('Web Audio error:', err);
        }
      }

      toggle() {
        if (!this.isInitialized) this.init();
        if (!this.ctx) return false;
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        this.isEnabled = !this.isEnabled;
        const targetGain = this.isEnabled ? 0.07 : 0.0001;
        this.ambientGain.gain.linearRampToValueAtTime(targetGain, this.ctx.currentTime + 1.2);
        return this.isEnabled;
      }

      playBubble(xNorm = 0.5, pitchBase = 580) {
        if (!this.isEnabled || !this.ctx || this.ctx.state !== 'running') return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          let panner = null;
          if (this.ctx.createStereoPanner) {
            panner = this.ctx.createStereoPanner();
            panner.pan.setValueAtTime(clamp(xNorm * 2 - 1, -0.85, 0.85), now);
          }

          const f0 = pitchBase + rand(-50, 50);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f0, now);
          osc.frequency.exponentialRampToValueAtTime(f0 * 1.32, now + 0.045);

          gain.gain.setValueAtTime(0.035, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.048);

          if (panner) {
            osc.connect(gain);
            gain.connect(panner);
            panner.connect(this.ctx.destination);
          } else {
            osc.connect(gain);
            gain.connect(this.ctx.destination);
          }

          osc.start(now);
          osc.stop(now + 0.05);
        } catch (_) { }
      }
    }

    const soundEngine = new SoundEngine();

    // =========================================================================
    // Neural Brain Architecture
    // =========================================================================
    class Brain {
      constructor(w1, w2) {
        this.w1 = w1 || Array.from({ length: 6 }, () =>
          Array.from({ length: 6 }, () => rand(-1.0, 1.0))
        );
        this.w2 = w2 || Array.from({ length: 2 }, () =>
          Array.from({ length: 7 }, () => rand(-1.0, 1.0))
        );
      }

      predict(x) {
        const hidden = this.w1.map(row => {
          let sum = 0;
          for (let i = 0; i < 6; i++) sum += row[i] * x[i];
          return Math.tanh(sum);
        });

        const hWithBias = [...hidden, 1.0];
        let sum0 = 0, sum1 = 0;
        for (let i = 0; i < 7; i++) {
          sum0 += this.w2[0][i] * hWithBias[i];
          sum1 += this.w2[1][i] * hWithBias[i];
        }
        const steer = Math.tanh(sum0);
        const thrust = 1.0 / (1.0 + Math.exp(-sum1));
        return [steer, thrust];
      }

      mutate(rate = 0.12, power = 0.22) {
        const mutateVal = v => (Math.random() < rate ? v + randn() * power : v);
        return new Brain(
          this.w1.map(row => row.map(mutateVal)),
          this.w2.map(row => row.map(mutateVal))
        );
      }
    }

    // =========================================================================
    // Spatial Grid for O(N) Neighbors
    // =========================================================================
    class SpatialGrid {
      constructor(cellSize = 90) {
        this.cellSize = cellSize;
        this.buckets = new Map();
      }
      clear() { this.buckets.clear(); }
      key(x, y) {
        return `${Math.floor(x / this.cellSize)},${Math.floor(y / this.cellSize)}`;
      }
      insert(entity) {
        const k = this.key(entity.x, entity.y);
        let list = this.buckets.get(k);
        if (!list) { list = []; this.buckets.set(k, list); }
        list.push(entity);
      }
      queryNeighbors(x, y, radius) {
        const results = [];
        const minCx = Math.floor((x - radius) / this.cellSize);
        const maxCx = Math.floor((x + radius) / this.cellSize);
        const minCy = Math.floor((y - radius) / this.cellSize);
        const maxCy = Math.floor((y + radius) / this.cellSize);
        const r2 = radius * radius;
        for (let cx = minCx; cx <= maxCx; cx++) {
          for (let cy = minCy; cy <= maxCy; cy++) {
            const list = this.buckets.get(`${cx},${cy}`);
            if (list) {
              for (let i = 0; i < list.length; i++) {
                const e = list[i];
                const dx = e.x - x;
                const dy = e.y - y;
                if (dx * dx + dy * dy <= r2) results.push(e);
              }
            }
          }
        }
        return results;
      }
    }

    const spatialGrid = new SpatialGrid(90);

    // =========================================================================
    // Algae Biofilm Surface Layer
    // =========================================================================
    class AlgaeGrid {
      constructor(w, h, cellSize = 38) {
        this.cellSize = cellSize;
        this.offscreen = document.createElement('canvas');
        this.offCtx = this.offscreen.getContext('2d', { alpha: true });
        this.resize(w, h);
      }

      resize(w, h) {
        this.w = w;
        this.h = h;
        this.cols = Math.ceil(w / this.cellSize);
        this.rows = Math.ceil(h / this.cellSize);
        this.total = this.cols * this.rows;
        this.grid = new Float32Array(this.total);
        this.offscreen.width = this.cols;
        this.offscreen.height = this.rows;
        this.imgData = this.offCtx.createImageData(this.cols, this.rows);
        this.seedColonies(10);
        this.dirty = true;
        this.updateTexture();
      }

      seedColonies(count) {
        for (let i = 0; i < count; i++) {
          const c = Math.floor(rand(2, this.cols - 2));
          const r = Math.floor(rand(2, this.rows - 2));
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const nc = c + dx;
              const nr = r + dy;
              if (nc >= 0 && nc < this.cols && nr >= 0 && nr < this.rows) {
                const idx = nr * this.cols + nc;
                this.grid[idx] = Math.min(0.55, (this.grid[idx] || 0) + rand(0.20, 0.35));
              }
            }
          }
        }
      }

      update(tick) {
        let changed = false;
        if (tick % 25 === 0) {
          for (let r = 0; r < this.rows; r++) {
            const light = 0.85 + (1.0 - r / this.rows) * 0.30;
            const rowOffset = r * this.cols;
            for (let c = 0; c < this.cols; c++) {
              const idx = rowOffset + c;
              const val = this.grid[idx];
              if (val > 0.04 && val < 0.60) {
                this.grid[idx] = Math.min(0.60, val + 0.0012 * light * (0.65 - val));
                changed = true;
              }
            }
          }
        }

        if (tick % 100 === 0) {
          const idx = Math.floor(Math.random() * this.total);
          if (this.grid[idx] < 0.08) {
            this.grid[idx] = 0.20;
            changed = true;
          }
        }

        if (changed) this.dirty = true;
        if (this.dirty && tick % 30 === 0) {
          this.updateTexture();
          this.dirty = false;
        }
      }

      updateTexture() {
        const d = this.imgData.data;
        for (let i = 0; i < this.total; i++) {
          const val = this.grid[i];
          const p = i * 4;
          if (val > 0.04) {
            d[p] = 20;
            d[p + 1] = 180;
            d[p + 2] = 145;
            d[p + 3] = Math.floor(val * 55);
          } else {
            d[p + 3] = 0;
          }
        }
        this.offCtx.putImageData(this.imgData, 0, 0);
      }

      grazeAt(x, y, radius = 24) {
        const c = Math.floor(x / this.cellSize);
        const r = Math.floor(y / this.cellSize);
        if (c < 0 || c >= this.cols || r < 0 || r >= this.rows) return 0;

        let gained = 0;
        const rCells = Math.ceil(radius / this.cellSize);
        for (let dy = -rCells; dy <= rCells; dy++) {
          for (let dx = -rCells; dx <= rCells; dx++) {
            const nc = c + dx;
            const nr = r + dy;
            if (nc >= 0 && nc < this.cols && nr >= 0 && nr < this.rows) {
              const idx = nr * this.cols + nc;
              if (this.grid[idx] > 0.10) {
                const bite = Math.min(this.grid[idx], 0.24);
                this.grid[idx] -= bite;
                gained += bite * 0.25; // Healthy nourishment
                this.dirty = true;
              }
            }
          }
        }
        return gained;
      }

      hasAlgaeAt(x, y, radius = 26) {
        const c = Math.floor(x / this.cellSize);
        const r = Math.floor(y / this.cellSize);
        if (c < 0 || c >= this.cols || r < 0 || r >= this.rows) return false;
        const rCells = Math.ceil(radius / this.cellSize);
        for (let dy = -rCells; dy <= rCells; dy++) {
          for (let dx = -rCells; dx <= rCells; dx++) {
            const nc = c + dx;
            const nr = r + dy;
            if (nc >= 0 && nc < this.cols && nr >= 0 && nr < this.rows) {
              if (this.grid[nr * this.cols + nc] > 0.12) return true;
            }
          }
        }
        return false;
      }

      getCoveragePct() {
        let covered = 0;
        for (let i = 0; i < this.total; i++) {
          if (this.grid[i] > 0.15) covered++;
        }
        return Math.round((covered / this.total) * 100);
      }

      draw(ctx) {
        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(this.offscreen, 0, 0, this.w, this.h);
        ctx.restore();
      }
    }

    // =========================================================================
    // Flexible Multi-Segment Benthic Flora
    // =========================================================================
    let plantIdCounter = 1;

    class Plant {
      constructor(x, type = 0) {
        this.id = plantIdCounter++;
        this.x = x;
        this.type = type;
        this.segmentCount = 6;
        this.maxHeight = rand(240, 310);
        this.biomass = rand(0.65, 0.90);
        // Well-balanced growth rate: yields ~1 bud every 20-25s, sustaining 3-5 fish comfortably
        this.growthRate = rand(0.00060, 0.00085);
        this.phase = rand(0, Math.PI * 2);
        this.recoil = 0;

        this.segments = Array.from({ length: this.segmentCount }, () => ({ x: this.x, y: 0 }));

        this.buds = [
          { segIndex: 3, t: 0.60, ready: true, x: x, y: 0, size: 4.2, energy: 0.45 },
          { segIndex: 5, t: 0.95, ready: true, x: x, y: 0, size: 5.0, energy: 0.52 }
        ];
      }

      update(timeSec, h) {
        if (this.biomass < 1.0) {
          const growth = this.growthRate * Math.max(0.12, this.biomass) * (1.05 - this.biomass);
          this.biomass = clamp(this.biomass + growth, 0.10, 1.0);
        }
        this.recoil *= 0.94;

        const currentHeight = this.maxHeight * Math.pow(this.biomass, 0.85);

        this.segments[0].x = this.x;
        this.segments[0].y = h;

        for (let i = 1; i < this.segmentCount; i++) {
          const frac = i / (this.segmentCount - 1);
          const prev = this.segments[i - 1];
          const targetY = h - frac * currentHeight;

          const curl = getCurlNoise(prev.x, targetY, timeSec);
          const fluidSway = curl.u * 12.0 * frac;
          const harmonicSway = Math.sin(timeSec * 0.9 + this.phase + i * 0.45) * (14.0 * frac);
          const recoilSway = this.recoil * frac;

          const targetX = this.x + fluidSway + harmonicSway + recoilSway;
          this.segments[i].x += (targetX - this.segments[i].x) * 0.18;
          this.segments[i].y = targetY;
        }

        for (let i = 0; i < this.buds.length; i++) {
          const b = this.buds[i];
          const requiredBiomass = (i + 1) / (this.buds.length + 0.35);
          b.ready = this.biomass >= requiredBiomass;
          const hostSeg = this.segments[b.segIndex] || this.segments[this.segmentCount - 1];
          b.x = hostSeg.x;
          b.y = hostSeg.y;
        }
      }

      graze(budIndex) {
        const b = this.buds[budIndex];
        if (b && b.ready) {
          b.ready = false;
          this.biomass = Math.max(0.12, this.biomass - 0.22);
          this.recoil = (Math.random() < 0.5 ? -18 : 18);
          return b.energy;
        }
        return 0;
      }

      fertilize(amount = 0.20) {
        this.biomass = clamp(this.biomass + amount, 0.10, 1.0);
      }

      draw(ctx, h) {
        const alpha = clamp(this.biomass * 0.70 + 0.30, 0.25, 0.95);
        const stemColor = this.type === 1 ? `rgba(20, 120, 90, ${alpha})` : `rgba(16, 96, 75, ${alpha})`;
        const budColor = this.type === 1 ? `rgba(94, 234, 212, ${alpha})` : `rgba(52, 211, 153, ${alpha})`;

        ctx.save();
        ctx.strokeStyle = stemColor;
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(this.segments[0].x, this.segments[0].y);
        for (let i = 1; i < this.segmentCount - 1; i++) {
          const xc = (this.segments[i].x + this.segments[i + 1].x) / 2;
          const yc = (this.segments[i].y + this.segments[i + 1].y) / 2;
          ctx.quadraticCurveTo(this.segments[i].x, this.segments[i].y, xc, yc);
        }
        ctx.lineTo(this.segments[this.segmentCount - 1].x, this.segments[this.segmentCount - 1].y);
        ctx.stroke();

        ctx.lineWidth = 1.2;
        for (let i = 1; i < this.segmentCount - 1; i++) {
          const seg = this.segments[i];
          const side = (i % 2 === 0) ? 1 : -1;
          ctx.beginPath();
          ctx.moveTo(seg.x, seg.y);
          ctx.quadraticCurveTo(seg.x + side * 14, seg.y - 6, seg.x + side * 22, seg.y - 12);
          ctx.stroke();
        }

        for (let i = 0; i < this.buds.length; i++) {
          const b = this.buds[i];
          if (b.ready) {
            ctx.fillStyle = budColor;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.0;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = `rgba(94, 234, 212, 0.25)`;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.size * 2.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();
      }
    }

    // =========================================================================
    // Suspended Marine Snow Particulate Matter
    // =========================================================================
    class MarineSnowParticle {
      constructor(w, h) {
        this.x = rand(0, w);
        this.y = rand(0, h);
        this.vx = 0;
        this.vy = 0;
        this.radius = rand(0.9, 2.2);
        this.baseAlpha = rand(0.18, 0.42);
        this.phase = rand(0, Math.PI * 2);
        this.buoyancy = rand(-0.06, -0.01);
      }

      update(w, h, timeSec) {
        const curl = getCurlNoise(this.x, this.y, timeSec);
        const brownianX = randn() * 0.06;
        const brownianY = randn() * 0.06;

        this.vx = this.vx * 0.92 + (curl.u * 0.45 + brownianX) * 0.08;
        this.vy = this.vy * 0.92 + (curl.v * 0.45 + brownianY + this.buoyancy) * 0.08;

        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0) this.x += w;
        if (this.x > w) this.x -= w;
        if (this.y < 0) this.y += h;
        if (this.y > h) this.y -= h;
      }

      draw(ctx, timeSec) {
        const alpha = this.baseAlpha * (0.65 + 0.35 * Math.sin(timeSec * 1.5 + this.phase));
        ctx.fillStyle = `rgba(180, 220, 230, ${alpha.toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // =========================================================================
    // Sunlight Nutrient Pellets

    class Nutrient {
      constructor(x, y, w, h) {

    // =========================================================================
    // Visual Water Ripples & FX Particles
    // =========================================================================
    class WaterRipple {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 4;
        this.maxRadius = 85;
        this.life = 1.0;
      }
      update() {
        this.radius += 2.0;
        this.life = Math.max(0, 1.0 - this.radius / this.maxRadius);
        return this.life <= 0;
      }
      draw(ctx) {
        ctx.save();
        ctx.strokeStyle = `rgba(94, 234, 212, ${(this.life * 0.45).toFixed(3)})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    class FXParticle {
      constructor(x, y, color, vx, vy, maxLife = 35, size = 2) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = vx;
        this.vy = vy;
        this.life = maxLife;
        this.maxLife = maxLife;
        this.size = size;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
      }
      draw(ctx) {
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.fillStyle = this.color.replace('ALPHA', alpha.toFixed(2));
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // =========================================================================
    // Magikarp Entity with Official Vector Art + Biomechanical Fluid Kinematics
    // =========================================================================
    let fishIdCounter = 1;

    class Magikarp {
      constructor(w, h, x, y, brain, gen = 1, traits = null, startEnergy = 1.5, startAge = 0) {
        this.id = fishIdCounter++;
        this.w = w;
        this.h = h;
        // Position (this.x, this.y) is the exact MOUTH / snout tip of the Magikarp!
        this.x = x !== undefined ? x : rand(90, w - 90);
        this.y = y !== undefined ? y : rand(90, h - 140);
        this.heading = rand(0, Math.PI * 2);
        this.speed = 1.4;
        this.energy = startEnergy;
        this.brain = brain || new Brain();
        this.gen = gen;
        this.age = startAge;
        this.lastReproAge = -1500;
        this.eaten = 0;

        // 4 Evolved Traits
        if (traits) {
          this.b1 = clamp(traits.b1 + randn() * 0.06, 0.15, 0.95);
          this.b2 = clamp(traits.b2 + randn() * 0.06, 0.15, 0.95);
          this.b3 = clamp(traits.b3 + randn() * 0.06, 0.15, 0.95);
          this.b4 = clamp(traits.b4 + randn() * 0.06, 0.15, 0.95);
        } else {
          this.b1 = rand(0.35, 0.75);
          this.b2 = rand(0.35, 0.75);
          this.b3 = rand(0.35, 0.75);
          this.b4 = rand(0.35, 0.75);
        }

        // Tu & Terzopoulos Ethological Drives
        this.hunger = 0.25;
        this.stress = 0.0;
        this.fatigue = 0.1;

        // Burst-and-Glide Gait
        this.isBursting = true;
        this.gaitTimer = Math.floor(rand(25, 45));
        this.tailWave = rand(0, Math.PI * 2);
        this.roamAngle = this.heading;

        // C-Start Escape Reflex
        this.cStartStage = 0;
        this.cStartTimer = 0;
        this.cStartEscapeAngle = 0;

        // Feeding Target
        this.eatingTarget = null;
        this.eatingTicks = 0;

        // Pattern & Coloration
        this.setupPhenotype();
      }

      setupPhenotype() {
        this.r = Math.round(40 + 215 * this.b1);
        this.g = Math.round(40 + 215 * this.b2);
        this.b = Math.round(40 + 215 * this.b3);

        this.hexBody = "#" + [this.r, this.g, this.b].map(x => x.toString(16).padStart(2, "0")).join("");
        let rDark = Math.round(this.r * 0.72);
        let gDark = Math.round(this.g * 0.72);
        let bDark = Math.round(this.b * 0.72);
        this.hexDark = "#" + [rDark, gDark, bDark].map(x => x.toString(16).padStart(2, "0")).join("");

        if (this.b1 > 0.76 && this.b2 > 0.76 && this.b3 > 0.76) {
          this.patternName = "Shiny Gold ★";
          this.hexBody = "#ffd700";
          this.hexDark = "#c69200";
        } else if (this.b1 > 0.65 && this.b3 > 0.55 && this.b2 < 0.5) {
          this.patternName = "Pink Orca";
        } else if (this.b3 > 0.72) {
          this.patternName = "Orca";
        } else if (this.b2 > 0.72) {
          this.patternName = "Tiger Stripes";
        } else if (Math.abs(this.b1 - this.b2) > 0.35 && this.b3 < 0.5) {
          this.patternName = "Calico";
        } else if (this.b1 > 0.72) {
          this.patternName = "Dapples";
        } else {
          this.patternName = "Two-Tone";
        }
      }

      triggerCStart(threatX, threatY) {
        if (this.cStartStage !== 0) return;
        this.stress = 1.0;
        this.cStartStage = 1;
        this.cStartTimer = 6;
        const angleFromThreat = Math.atan2(this.y - threatY, this.x - threatX);
        this.cStartEscapeAngle = angleFromThreat + rand(-0.35, 0.35);
        soundEngine.playBubble(this.x / this.w, 700);
      }

      update(candidates, algaeGrid, marineSnow, w, h, timeSec) {
        this.w = w;
        this.h = h;
        this.age++;

        // 1. Metabolic Burn
        const speedSq = this.speed * this.speed;
        const burn = 0.00018 * (1.0 + 0.22 * speedSq);
        this.energy -= burn;
        this.hunger = clamp(this.hunger + burn * 0.35, 0, 1.0);
        this.stress = Math.max(0, this.stress - 0.012);

        // 2. Couzin Three-Zone Schooling
        const neighbors = spatialGrid.queryNeighbors(this.x, this.y, 300);
        let repX = 0, repY = 0, repCount = 0;
        let oriX = 0, oriY = 0, oriCount = 0;
        let attX = 0, attY = 0, attCount = 0;

        const rRep = 85.0;
        const rOri = 180.0;
        const rAtt = 290.0;

        for (let i = 0; i < neighbors.length; i++) {
          const other = neighbors[i];
          if (other === this || !(other instanceof Magikarp)) continue;

          const dx = other.x - this.x;
          const dy = other.y - this.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 0.01) continue;

          const angleToOther = Math.atan2(dy, dx);
          if (Math.abs(angleWrap(angleToOther - this.heading)) > (Math.PI * 0.82)) continue;

          if (dist < rRep) {
            repX -= dx / dist;
            repY -= dy / dist;
            repCount++;
          } else if (dist < rOri) {
            oriX += Math.cos(other.heading);
            oriY += Math.sin(other.heading);
            oriCount++;
          } else if (dist < rAtt) {
            attX += dx / dist;
            attY += dy / dist;
            attCount++;
          }
        }

        // 3. Behavioral Steering & Food Navigation
        let desiredAngle = this.heading;
        const isSeekingFood = this.energy < 1.45 && candidates.length > 0;

        if (this.cStartStage > 0) {
          if (this.cStartStage === 1) {
            this.speed *= 0.70;
            this.cStartTimer--;
            if (this.cStartTimer <= 0) {
              this.cStartStage = 2;
              this.cStartTimer = 18;
              this.speed = 3.6;
              this.heading = this.cStartEscapeAngle;
            }
          } else if (this.cStartStage === 2) {
            desiredAngle = this.cStartEscapeAngle;
            this.cStartTimer--;
            if (this.cStartTimer <= 0) {
              this.cStartStage = 0;
            }
          }
        } else if (isSeekingFood) {
          let nearest = null;
          let minDist = Infinity;
          for (let i = 0; i < candidates.length; i++) {
            const c = candidates[i];
            const dist = Math.hypot(c.x - this.x, c.y - this.y);
            const bias = c.isPlant ? (1.4 - this.b2 * 0.8) : (1.4 - this.b3 * 0.8);
            const effectiveDist = dist * bias;
            if (effectiveDist < minDist) {
              minDist = effectiveDist;
              nearest = c;
            }
          }
          if (nearest) {
            desiredAngle = Math.atan2(nearest.y - this.y, nearest.x - this.x);
          }
        } else if (repCount > 0) {
          desiredAngle = Math.atan2(repY, repX);
        } else if (oriCount > 0 || attCount > 0) {
          const combinedX = oriX * 1.1 + attX * 0.7;
          const combinedY = oriY * 1.1 + attY * 0.7;
          desiredAngle = Math.atan2(combinedY, combinedX);
        } else {
          const curl = getCurlNoise(this.x, this.y, timeSec);
          this.roamAngle += rand(-0.025, 0.025) + curl.u * 0.002;
          desiredAngle = this.roamAngle;
        }

        // 4. Soft Boundary Steering (Anticipatory Margins)
        const margin = 125.0;
        let boundX = 0, boundY = 0;
        if (this.x < margin) boundX += Math.pow(1 - this.x / margin, 2);
        else if (this.x > w - margin) boundX -= Math.pow(1 - (w - this.x) / margin, 2);
        if (this.y < margin) boundY += Math.pow(1 - this.y / margin, 2);
        else if (this.y > h - margin) boundY -= Math.pow(1 - (h - this.y) / margin, 2);

        if (boundX !== 0 || boundY !== 0) {
          const wallAngle = Math.atan2(boundY, boundX);
          const angleDiff = angleWrap(wallAngle - this.heading);
          this.heading += angleDiff * clamp(Math.hypot(boundX, boundY) * 0.12, 0, 0.18);
          this.roamAngle = this.heading;
        } else {
          const angleDiff = angleWrap(desiredAngle - this.heading);
          const maxTurn = this.cStartStage > 0 ? 0.15 : 0.034;
          this.heading += clamp(angleDiff, -maxTurn, maxTurn);
        }

        // 5. Burst-and-Glide Pacing
        this.gaitTimer--;
        if (this.gaitTimer <= 0) {
          this.isBursting = !this.isBursting;
          this.gaitTimer = this.isBursting ? Math.floor(rand(25, 45)) : Math.floor(rand(35, 60));
        }

        const cruisePace = 1.2 + this.b1 * 0.6;
        if (this.cStartStage > 0) {
          // Escape burst
        } else if (this.isBursting) {
          this.speed = this.speed * 0.92 + cruisePace * 0.08;
        } else {
          this.speed = this.speed * 0.985 + 0.95 * 0.015;
        }

        this.tailWave += 0.08 + this.speed * 0.06;

        // Movement forward: The mouth (this.x, this.y) leads the direction vector!
        this.x += Math.cos(this.heading) * this.speed;
        this.y += Math.sin(this.heading) * this.speed;

        this.x = clamp(this.x, 45, w - 45);
        this.y = clamp(this.y, 45, h - 45);

        // 6. Natural Grazing & Feeding (Mouth contacts food directly!)
        let grazedOutcome = { grazed: false };

        if (this.eatingTarget) {
          this.eatingTicks++;
          this.speed *= 0.95;

          if (this.eatingTicks >= 20) {
            if (this.eatingTarget.type === "plant") {
              const gain = this.eatingTarget.plant.graze(this.eatingTarget.budIndex);
              if (gain > 0) {
                this.energy = Math.min(this.energy + gain * (0.75 + 0.25 * this.b2), 2.2);
                this.hunger = Math.max(0, this.hunger - 0.55);
                this.eaten++;
                grazedOutcome = { grazed: true, isPlant: true, x: this.x, y: this.y };
                soundEngine.playBubble(this.x / this.w, 620);
              }
            } else if (this.eatingTarget.type === "algae") {
              const gain = algaeGrid.grazeAt(this.eatingTarget.x, this.eatingTarget.y, 34);
              if (gain > 0) {
                this.energy = Math.min(this.energy + gain * (0.75 + 0.25 * this.b3), 2.2);
                this.hunger = Math.max(0, this.hunger - 0.40);
                this.eaten++;
                grazedOutcome = { grazed: true, isAlgae: true, x: this.x, y: this.y };
                soundEngine.playBubble(this.x / this.w, 560);
              }
            }
            this.eatingTarget = null;
            this.eatingTicks = 0;
          }
        } else if (this.energy < 1.8) {
          let touchedBud = null;
          for (let p of plants) {
            for (let bIdx = 0; bIdx < p.buds.length; bIdx++) {
              const bud = p.buds[bIdx];
              if (bud.ready && Math.hypot(bud.x - this.x, bud.y - this.y) < 46) {
                touchedBud = { plant: p, budIndex: bIdx, x: bud.x, y: bud.y };
                break;
              }
            }
            if (touchedBud) break;
          }

          if (touchedBud) {
            this.eatingTarget = { type: "plant", plant: touchedBud.plant, budIndex: touchedBud.budIndex };
            this.eatingTicks = 0;
          } else if (algaeGrid.hasAlgaeAt(this.x, this.y, 34)) {
            this.eatingTarget = { type: "algae", x: this.x, y: this.y };
            this.eatingTicks = 0;
          }
        }

        if (this.y < 35 && Math.random() < 0.03) {
          soundEngine.playBubble(this.x / this.w, 800);
        }

        return grazedOutcome;
      }

      // Draw authentic Magikarp with moving SVG parts and mouth leading the vector!
      draw(ctx) {
        const parts = getCompiledParts();
        ctx.save();
        ctx.translate(this.x, this.y); // Anchored at the MOUTH!

        // Determine facing direction & pitch angle
        // In BOTH directions, mouth tilts towards velocity, dorsal crown stays on top, belly never leads!
        const facingRight = Math.cos(this.heading) >= 0;
        let pitch = 0;
        if (facingRight) {
          pitch = clamp(this.heading, -0.42, 0.42);
          ctx.rotate(pitch);
          ctx.scale(-1, 1); // Flip horizontally because SVG natively faces LEFT
        } else {
          const diff = angleWrap(this.heading - Math.PI);
          pitch = clamp(diff, -0.42, 0.42);
          ctx.rotate(pitch);
        }

        // Natural swimming body recoil at mouth
        const bodyWobble = Math.sin(this.tailWave) * (this.isBursting ? 0.04 : 0.018);
        ctx.rotate(bodyWobble);

        const maturityScale = clamp(this.age / 900, 0.70, 1.0);
        const s = (150 / 262) * maturityScale;
        ctx.scale(s, s);

        // Shift mouth (2.0, 120.0) in SVG space to (0, 0) in local canvas space
        ctx.translate(-MAGIKARP_PIVOTS.mouth.x, -MAGIKARP_PIVOTS.mouth.y);

        const renderList = (list) => {
          for (let i = 0; i < list.length; i++) {
            const item = list[i];
            let color = item.fill;
            if (color === "BODY") color = this.hexBody;
            else if (color === "DARK") color = this.hexDark;
            ctx.fillStyle = color;
            ctx.fill(item.path);
          }
        };

        // 1. Front Whisker (far side, behind body) - dynamically sways with current!
        const w1Angle = Math.sin(this.tailWave * 0.85 + 0.6) * 0.18 + (this.speed * 0.04);
        ctx.save();
        ctx.translate(MAGIKARP_PIVOTS.frontWhisker.x, MAGIKARP_PIVOTS.frontWhisker.y);
        ctx.rotate(w1Angle);
        ctx.translate(-MAGIKARP_PIVOTS.frontWhisker.x, -MAGIKARP_PIVOTS.frontWhisker.y);
        renderList(parts.frontWhisker);
        ctx.restore();

        // 2. Caudal Tail Fin & Dorsal Back Fin (articulates dynamically at caudal peduncle)
        const tailWag = Math.sin(this.tailWave) * (this.isBursting ? 0.25 : 0.10);
        ctx.save();
        ctx.translate(MAGIKARP_PIVOTS.tail.x, MAGIKARP_PIVOTS.tail.y);
        ctx.rotate(tailWag);
        ctx.translate(-MAGIKARP_PIVOTS.tail.x, -MAGIKARP_PIVOTS.tail.y);
        renderList(parts.tail);
        ctx.restore();

        // 3. Ventral Pelvic Fin / Bottom Crown (articulates gracefully under the belly)
        const bottomCrownAngle = Math.sin(this.tailWave * 0.9 + 2.4) * 0.08 + (this.speed * 0.02);
        ctx.save();
        ctx.translate(MAGIKARP_PIVOTS.bottomCrown.x, MAGIKARP_PIVOTS.bottomCrown.y);
        ctx.rotate(bottomCrownAngle);
        ctx.translate(-MAGIKARP_PIVOTS.bottomCrown.x, -MAGIKARP_PIVOTS.bottomCrown.y);
        renderList(parts.bottomCrown);
        ctx.restore();

        // 4. Main Torso, Head, Eyes & Lips
        renderList(parts.body);

        // 5. Dorsal Crown (top crown, sways gently on back)
        const crownAngle = Math.sin(this.tailWave * 0.9 + 1.5) * 0.06;
        ctx.save();
        ctx.translate(MAGIKARP_PIVOTS.crown.x, MAGIKARP_PIVOTS.crown.y);
        ctx.rotate(crownAngle);
        ctx.translate(-MAGIKARP_PIVOTS.crown.x, -MAGIKARP_PIVOTS.crown.y);
        renderList(parts.crown);
        ctx.restore();

        // 5. Pectoral Fin (fans rhythmically)
        const finFan = Math.sin(this.tailWave * 0.65) * 0.14;
        ctx.save();
        ctx.translate(MAGIKARP_PIVOTS.pectoral.x, MAGIKARP_PIVOTS.pectoral.y);
        ctx.rotate(finFan);
        ctx.translate(-MAGIKARP_PIVOTS.pectoral.x, -MAGIKARP_PIVOTS.pectoral.y);
        renderList(parts.pectoral);
        ctx.restore();

        // 6. Main Long Whisker (near side, in front of body, undulating!)
        const w2Angle = Math.sin(this.tailWave * 0.75 + 1.2) * 0.22 + (this.speed * 0.06);
        ctx.save();
        ctx.translate(MAGIKARP_PIVOTS.mainWhisker.x, MAGIKARP_PIVOTS.mainWhisker.y);
        ctx.rotate(w2Angle);
        ctx.translate(-MAGIKARP_PIVOTS.mainWhisker.x, -MAGIKARP_PIVOTS.mainWhisker.y);
        renderList(parts.mainWhisker);
        ctx.restore();

        // 7. Shiny Gold ★ Orbiting Stars
        if (this.patternName === "Shiny Gold ★") {
          const starTime = Date.now() * 0.003;
          for (let s = 0; s < 3; s++) {
            const ang = starTime + (s * Math.PI * 2 / 3);
            const sx = 130 + Math.cos(ang) * 90;
            const sy = 140 + Math.sin(ang) * 60;
            ctx.fillStyle = "#fef08a";
            ctx.beginPath();
            ctx.arc(sx, sy, 5, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.restore();
      }
    }
    // =========================================================================

    const causticsCanvas = document.createElement('canvas');
    const causticsCtx = causticsCanvas.getContext('2d');
    let causticsPattern = null;

    function buildCausticsTexture() {
      const cw = causticsCanvas.width;
      const ch = causticsCanvas.height;
      causticsCtx.clearRect(0, 0, cw, ch);
      causticsCtx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 42; i++) {
        const x = rand(0, cw);
        const y = rand(0, ch);
        const rx = rand(14, 42);
        const ry = rand(4, 14);
        causticsCtx.save();
        causticsCtx.translate(x, y);
        causticsCtx.rotate(rand(-0.85, 0.85));
        causticsCtx.scale(1, ry / rx);
        const grad = causticsCtx.createRadialGradient(0, 0, 0, 0, 0, rx);
        grad.addColorStop(0, 'rgba(170, 235, 255, 0.42)');
        grad.addColorStop(0.38, 'rgba(125, 215, 245, 0.16)');
        grad.addColorStop(1, 'rgba(90, 190, 225, 0)');
        causticsCtx.fillStyle = grad;
        causticsCtx.beginPath();
        causticsCtx.arc(0, 0, rx, 0, Math.PI * 2);
        causticsCtx.fill();
        causticsCtx.restore();
      }
      causticsCtx.globalCompositeOperation = 'source-over';
      causticsPattern = ctx.createPattern(causticsCanvas, 'repeat');
    }

        const raw = localStorage.getItem(CHAMPION_STORAGE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!data || !data.w1 || !data.w2) return null;
        return data;
      } catch (err) {
        return null;
      }
    }

    let savedHighestFish = (isSaveMode ? loadChampionLocal() : null) || JSON.parse(JSON.stringify(DEFAULT_CHAMPION));
    let sessionMaxGen = 1;
    let sessionReachedGen5 = false;

    function updateSpawnButtonText() {
      const span = document.getElementById('spawn-btn-gen');
      if (span && savedHighestFish) {
        span.textContent = 'Gen ' + (savedHighestFish.gen || 1);
      }
    }

    async function syncChampionFromFile() {
      if (!isSaveMode) return;
      if (typeof fetch === 'undefined') return;
      const endpoints = [API_URL, LOCAL_API_URL];
      for (const url of endpoints) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (data && data.gen && data.w1 && data.w2) {
              if (!savedHighestFish || data.gen >= savedHighestFish.gen) {
                savedHighestFish = data;
                try {
                  if (typeof localStorage !== 'undefined') {
                    localStorage.setItem(CHAMPION_STORAGE_KEY, JSON.stringify(data));
                  }
                } catch (_) { }
                updateSpawnButtonText();
              }
              return;
            }
          }
        } catch (_) { }
      }
    }
    if (isSaveMode) {
      syncChampionFromFile();
    }

    async function saveChampionFish(fish) {
      try {
        if (!fish) return;
        const championData = {
          gen: fish.gen,
          w1: fish.brain.w1,
          w2: fish.brain.w2,
          b1: fish.b1,
          b2: fish.b2,
          b3: fish.b3,
          b4: fish.b4,
          savedAt: new Date().toISOString()
        };
        // Always track the session champion in memory
        savedHighestFish = championData;
        updateSpawnButtonText();

        // In 'new' mode, state is strictly per-session in-memory and never written to disk or storage
        if (!isSaveMode) return;

        try {
          if (typeof localStorage !== 'undefined') {
            localStorage.setItem(CHAMPION_STORAGE_KEY, JSON.stringify(championData));
          }
        } catch (_) { }

        if (typeof fetch !== 'undefined') {
          const endpoints = [API_URL, LOCAL_API_URL];
          for (const url of endpoints) {
            try {
              const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(championData)
              });
              if (res.ok) break;
            } catch (_) { }
          }
        }
      } catch (err) { }
    }

    function spawnHighestGenFish() {
      // Free spawning: the tank's natural food scarcity will balance the carrying capacity around 5!
      if (fishes.length >= 40) return; // Technical ceiling to prevent memory issues
      const champ = savedHighestFish || loadChampionLocal() || DEFAULT_CHAMPION;
      const brain = new Brain(champ.w1, champ.w2);
      const traits = { b1: champ.b1, b2: champ.b2, b3: champ.b3, b4: champ.b4 };
      const sX = rand(90, Math.max(120, w - 90));
      const sY = rand(90, Math.max(120, h - 120));
      const fish = new Magikarp(w, h, sX, sY, brain, champ.gen, traits, 1.6, 900);
      fishes.push(fish);

      for (let p = 0; p < 12; p++) {
        const ang = (Math.PI * 2 * p) / 12;
        fxParticles.push(new FXParticle(
          sX, sY, 'rgba(251, 191, 36, ALPHA)',
          Math.cos(ang) * 2.0, Math.sin(ang) * 2.0, 30, 2.2
        ));
      }
      soundEngine.playBubble(sX / w, 680);
    }

    const btnSpawnChampion = document.getElementById('btn-spawn-champion');
    if (btnSpawnChampion) {
      btnSpawnChampion.addEventListener('click', spawnHighestGenFish);
    }
    updateSpawnButtonText();

    // Soft Fascination Inactivity Auto-Hiding HUD
    const hudOverlay = document.getElementById('hud-overlay');
    const bottomHint = document.getElementById('bottom-hint');
    let idleTimeout = null;
    let isIdle = false;

    function resetIdleTimer() {
      isIdle = false;
      if (hudOverlay) hudOverlay.classList.remove('idle-hidden');
      if (bottomHint) bottomHint.classList.remove('idle-hidden');
      clearTimeout(idleTimeout);
      idleTimeout = setTimeout(() => {
        isIdle = true;
        if (hudOverlay) hudOverlay.classList.add('idle-hidden');
        if (bottomHint) bottomHint.classList.add('idle-hidden');
      }, 3600);
    }
    window.addEventListener('mousemove', resetIdleTimer);
    window.addEventListener('mousedown', resetIdleTimer);
    window.addEventListener('pointerdown', resetIdleTimer);
    window.addEventListener('touchstart', resetIdleTimer);
    resetIdleTimer();

    // Interactive PointerDown Water Ripples (Instant response on Lively Wallpaper & desktop click)
    let lastInteractionTime = 0;
    function handleWaterInteraction(e) {
      const now = performance.now();
      if (now - lastInteractionTime < 60) return;
      lastInteractionTime = now;
      resetIdleTimer();

      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      ripples.push(new WaterRipple(clickX, clickY));
      soundEngine.playBubble(clickX / w, 520);

      for (let f of fishes) {
        const d = Math.hypot(f.x - clickX, f.y - clickY);
        if (d < 160) {
          f.triggerCStart(clickX, clickY);
        }
      }
    }

    canvas.addEventListener('pointerdown', handleWaterInteraction);
    if (!window.PointerEvent) {
      canvas.addEventListener('mousedown', handleWaterInteraction);
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length > 0) handleWaterInteraction(e.touches[0]);
      });
    }

    // Ambient Audio Toggle Button
    const btnAudio = document.getElementById('btn-audio');
    const audioIcon = document.getElementById('audio-icon');
    const audioLabel = document.getElementById('audio-label');
    if (btnAudio) {
      btnAudio.addEventListener('click', () => {
        const isNowOn = soundEngine.toggle();
        if (isNowOn) {
          btnAudio.classList.add('active');
          audioIcon.textContent = '🔊';
          audioLabel.textContent = 'Audio Active';
        } else {
          btnAudio.classList.remove('active');
          audioIcon.textContent = '🔈';
          audioLabel.textContent = 'Ambient Audio';
        }
      });
    }

    // Telemetry Elements
    const metricPop = document.getElementById('metric-pop');
    const metricGen = document.getElementById('metric-gen');
    const metricFps = document.getElementById('metric-fps');
    const metricBiomassPct = document.getElementById('metric-biomass-pct');
    const metricBiomassBar = document.getElementById('metric-biomass-bar');
    const metricAlgaePct = document.getElementById('metric-algae-pct');
    const metricAlgaeBar = document.getElementById('metric-algae-bar');
    const ecoStatus = document.getElementById('eco-status');

    let isTabActive = true;
    let lastTime = performance.now();
    document.addEventListener('visibilitychange', () => {
      isTabActive = !document.hidden;
      if (isTabActive) {
        lastTime = performance.now();
        requestAnimationFrame(render);
      }
    });

    // =========================================================================
    // Simulation Step: Physics, Ethology & Scarcity Economics
    // =========================================================================
    let tickCount = 0;
    let cachedCandidates = [];
    let lastCandidateTick = -100;

    function updateSimulationStep(timeSec) {
      tickCount++;

      algaeGrid.update(tickCount);

      for (let p of plants) {
        p.update(timeSec, h);
      }

      for (let m of marineSnow) {
        m.update(w, h, timeSec);
      }

      spatialGrid.clear();
      for (let f of fishes) {
        spatialGrid.insert(f);
      }

      // Food sources are biological state, not frame-rate state. Rebuild only
      // twice per second at the normal 30 Hz simulation rate.
      if (tickCount - lastCandidateTick >= 15) {
        lastCandidateTick = tickCount;
        cachedCandidates = [];

        for (let p of plants) {
          for (let i = 0; i < p.buds.length; i++) {
            if (p.buds[i].ready) {
              cachedCandidates.push({
                isPlant: true,
                plant: p,
                budIndex: i,
                x: p.buds[i].x,
                y: p.buds[i].y
              });
            }
          }
        }

        for (let r = 2; r < algaeGrid.rows - 2; r += 3) {
          const rowOffset = r * algaeGrid.cols;
          for (let c = 2; c < algaeGrid.cols - 2; c += 3) {
            if (algaeGrid.grid[rowOffset + c] > 0.16) {
              cachedCandidates.push({
                isPlant: false,
                x: (c + 0.5) * algaeGrid.cellSize,
                y: (r + 0.5) * algaeGrid.cellSize
              });
            }
          }
        }
      }

      if (tickCount % 260 === 0 && Math.random() < 0.40) {
        nutrients.push(new Nutrient(rand(50, w - 50), 10, w, h));
      }

      for (let nIdx = nutrients.length - 1; nIdx >= 0; nIdx--) {
        const nut = nutrients[nIdx];
        const reachedBottom = nut.update(h);
        let consumed = false;
        for (let p of plants) {
          if (Math.abs(p.x - nut.x) < 32 && nut.y > h - p.maxHeight * p.biomass) {
            p.fertilize(0.18);
            consumed = true;
            break;
          }
        }
        if (consumed || reachedBottom) {
          nutrients.splice(nIdx, 1);
        }
      }

      // Update Magikarp
      for (let i = fishes.length - 1; i >= 0; i--) {
        const f = fishes[i];
        const outcome = f.update(cachedCandidates, algaeGrid, marineSnow, w, h, timeSec);

        if (outcome.grazed) {
          lastCandidateTick = -100;
          if (fxParticles.length < 20) {
            const pColor = outcome.isPlant ? 'rgba(52, 211, 153, ALPHA)' : 'rgba(94, 234, 212, ALPHA)';
            fxParticles.push(new FXParticle(
              outcome.x, outcome.y, pColor,
              rand(-0.6, 0.6), rand(-0.8, 0.2), 22, 1.6
            ));
          }
        }

        // Reproduction Requirements
        const minMaturityAge = 1000;
        const reproCooldown = 1200;
        const isMature = f.age >= minMaturityAge;
        const cooldownElapsed = (f.age - f.lastReproAge) >= reproCooldown;
        const reproThreshold = 1.65;
        const reproCost = 0.65;

        if (isMature && cooldownElapsed && f.energy >= reproThreshold && fishes.length < 35) {
          f.energy -= reproCost;
          f.lastReproAge = f.age;
          const childGen = f.gen + 1;
          if (childGen > sessionMaxGen) sessionMaxGen = childGen;

          const child = new Magikarp(
            w, h,
            f.x + rand(-18, 18),
            f.y + rand(-18, 18),
            f.brain.mutate(0.12, 0.22),
            childGen,
            { b1: f.b1, b2: f.b2, b3: f.b3, b4: f.b4 },
            reproCost * 0.85,
            0
          );
          fishes.push(child);

          if (childGen >= 5) {
            if (!sessionReachedGen5) {
              sessionReachedGen5 = true;
              saveChampionFish(child);
            } else if (!savedHighestFish || childGen >= savedHighestFish.gen) {
              saveChampionFish(child);
            }
          }

          for (let p = 0; p < 8; p++) {
            const ang = (Math.PI * 2 * p) / 8;
            fxParticles.push(new FXParticle(
              f.x, f.y, 'rgba(251, 191, 36, ALPHA)',
              Math.cos(ang) * 1.5, Math.sin(ang) * 1.5, 25, 2.0
            ));
          }
        }

        // Starvation death
        if (f.energy <= 0) {
          fishes.splice(i, 1);
        }
      }

      // Preserve session pioneer
      if (fishes.length === 0) {
        fishes.push(new Magikarp(w, h, undefined, undefined, null, 1, null, 1.5, 900));
      }
    }

    // =========================================================================
    // Procedural Optical Caustics Generator (pre-rendered texture, GPU-composited)
    // =========================================================================
    function drawCaustics(timeSec) {
      if (!causticsPattern) return;
      const cw = causticsCanvas.width;
      const ch = causticsCanvas.height;
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.09;
      ctx.translate((timeSec * 9) % cw, (timeSec * 4) % ch);
      ctx.fillStyle = causticsPattern;
      ctx.fillRect(-cw, -ch, w + cw * 2, h + ch * 2);
      ctx.globalAlpha = 0.045;
      ctx.translate((-timeSec * 15) % cw, (timeSec * 7) % ch);
      ctx.fillRect(-cw, -ch, w + cw * 2, h + ch * 2);
      ctx.restore();
    }

    // =========================================================================
    // Main Restorative Render Loop
    // =========================================================================
    let frameCount = 0;
    let fps = 60;
    let lastRenderTime = 0;
    let nextTelemetryTime = 0;
    let isWindowFocused = document.hasFocus();

    window.addEventListener('focus', () => { isWindowFocused = true; });
    window.addEventListener('blur', () => { isWindowFocused = false; });

    function targetFrameMs() {
      // When actively interacted with, run at 24 FPS (even behind active apps in Lively Wallpaper).
      // Drops to 10 FPS when idle to preserve CPU and battery.
      return isIdle ? 1000 / 10 : 1000 / 500;
    }

    function render(now) {
      if (!isTabActive) return;

      if (now - lastRenderTime < targetFrameMs()) {
        requestAnimationFrame(render);
        return;
      }
      lastRenderTime = now;

      const delta = now - lastTime;
      lastTime = now;
      const timeSec = now * 0.001;
      fps = Math.round(1000 / Math.max(1, delta));

      updateSimulationStep(timeSec);

      for (let i = fxParticles.length - 1; i >= 0; i--) {
        const p = fxParticles[i];
        p.update();
        if (p.life <= 0) fxParticles.splice(i, 1);
      }
      for (let i = ripples.length - 1; i >= 0; i--) {
        if (ripples[i].update()) ripples.splice(i, 1);
      }

      // 1. Beer-Lambert Optical Depth Stratification Gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
      bgGrad.addColorStop(0.00, '#0a2e3b');
      bgGrad.addColorStop(0.35, '#071d28');
      bgGrad.addColorStop(0.70, '#05131d');
      bgGrad.addColorStop(1.00, '#03080e');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // 2. Procedural Water Caustics Shimmer
      drawCaustics(timeSec);

      // 3. Subtle Ambient Kelp Silhouettes
      ctx.strokeStyle = '#05141e';
      ctx.lineWidth = 2.5;
      for (let x = 60; x < w; x += 220) {
        ctx.beginPath();
        ctx.moveTo(x, h);
        const curl = getCurlNoise(x, h * 0.5, timeSec);
        const sway = Math.sin(timeSec * 0.7 + x) * 18 + curl.u * 12;
        ctx.quadraticCurveTo(x - sway, h * 0.55, x + sway, h * 0.12);
        ctx.stroke();
      }

      // 4. Benthic Seabed Substrate
      ctx.fillStyle = '#020508';
      ctx.beginPath();
      ctx.moveTo(0, h);
      ctx.lineTo(0, h - 12);
      for (let x = 0; x <= w; x += 90) {
        const wave = Math.sin(x * 0.015) * 4;
        ctx.lineTo(x, h - 12 + wave);
      }
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fill();

      // 5. Living Flexible Benthic Flora
      for (let p of plants) {
        p.draw(ctx, h);
      }

      // 6. Suspended Marine Snow
      for (let m of marineSnow) {
        m.draw(ctx, timeSec);
      }

      // 7. Rare Nutrients & Visual Particles
      for (let n of nutrients) {
        n.draw(ctx);
      }
      for (let p of fxParticles) {
        p.draw(ctx);
      }

      // 8. Water Click Ripples
      for (let r of ripples) {
        r.draw(ctx);
      }

      // 9. Magikarp Organisms
      for (let f of fishes) {
        f.draw(ctx);
      }

      // 10. Translucent Glass Biofilm Layer
      algaeGrid.draw(ctx);

      // Telemetry HUD Metrics
      frameCount++;
      if (now >= nextTelemetryTime) {
        nextTelemetryTime = now + 1000;
        metricPop.textContent = fishes.length;
        metricGen.textContent = 'Gen ' + sessionMaxGen;
        metricFps.textContent = fps;

        const avgBiomass = plants.length > 0
          ? plants.reduce((a, b) => a + b.biomass, 0) / plants.length
          : 0;
        const biomassPct = Math.round(avgBiomass * 100);
        metricBiomassPct.textContent = biomassPct + '%';
        metricBiomassBar.style.width = biomassPct + '%';

        const algaePct = algaeGrid.getCoveragePct();
        metricAlgaePct.textContent = algaePct + '%';
        metricAlgaeBar.style.width = algaePct + '%';

        if (biomassPct < 35) {
          ecoStatus.textContent = 'Scarce Forage';
          ecoStatus.className = 'status-badge status-sparse';
        } else if (biomassPct > 70) {
          ecoStatus.textContent = 'Lush Serenity';
          ecoStatus.className = 'status-badge status-balanced';
        } else {
          ecoStatus.textContent = 'Serene Balance';
          ecoStatus.className = 'status-badge status-balanced';
        }
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>

</html>
